<!DOCTYPE html>
<html lang="zh-HK">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>童寫繁體字 KidsWriteTC</title>
  </head>
  <body>
    <div id="app">
      <header>
        <h1 id="ui-title">童寫繁體字 KidsWriteTC</h1>
        <p id="ui-desc">參考香港教育局《香港小學學習字詞表》標準設計</p>
        
        <div class="lang-selector">
          <button data-lang="zh-HK">繁體 (HK)</button>
          <button data-lang="zh-CN">简体 (CN)</button>
          <button data-lang="en">EN</button>
        </div>
      </header>

      <main>
        <!-- 頂部查詢列 -->
        <div class="search-section">
          <div class="search-bar">
            <span class="search-label">直接輸入漢字</span>
            <input type="text" id="input-char" maxlength="1" value="中" />
            <button id="btn-search" class="btn-primary">查詢</button>
          </div>
        </div>

        <!-- EDB 風格主展示區：左邊畫布，右邊漢字屬性 -->
        <div class="edb-display-container">
          <!-- 左側：米字格教學畫布 -->
          <div class="canvas-wrapper">
            <div class="canvas-container">
              <!-- 左上角筆劃計數 -->
              <div id="stroke-badge" class="stroke-badge">1</div>
              <canvas id="trace-canvas"></canvas>
              <!-- 仿 EDB 畫布右下角播放暫停圓鈕 -->
              <button id="btn-play-bubble" class="play-bubble" title="播放 / 暫停">▶</button>
            </div>
            
            <!-- 筆劃微調與描紅工具列 -->
            <div class="playback-controls">
              <button id="btn-prev-stroke">上一劃</button>
              <button id="btn-next-stroke">下一劃</button>
              <button id="btn-replay">重新示範</button>
              <button id="btn-clear" class="btn-danger">清除筆跡</button>
            </div>
          </div>

          <!-- 右側：部首、筆劃、讀音屬性卡片 -->
          <div class="meta-card">
            <div class="meta-table">
              <div class="meta-row header-row">
                <div class="meta-cell">部首</div>
                <div class="meta-cell">總筆畫數</div>
              </div>
              <div class="meta-row content-row">
                <div class="meta-cell" id="meta-radical">丨 部</div>
                <div class="meta-cell" id="meta-total-strokes">4 畫</div>
              </div>
            </div>

            <div class="pronounce-table">
              <div class="pronounce-header">字音</div>
              <div class="pronounce-row">
                <span class="pronounce-label">粵語</span>
                <span id="meta-jyutping" class="pronounce-val">zung1</span>
                <span id="meta-homophone" class="pronounce-note">〔宗〕</span>
                <button id="btn-audio-cantonese" class="btn-audio" title="粵語發音">🔊</button>
              </div>
              <div class="pronounce-row">
                <span class="pronounce-label">普通話</span>
                <span id="meta-pinyin" class="pronounce-val">zhōng</span>
                <button id="btn-audio-mandarin" class="btn-audio" title="普通話發音">🔊</button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
    
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
